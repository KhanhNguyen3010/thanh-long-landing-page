<!-- Khối Mobile Menu Overlay (Dán vào ngay DƯỚI thẻ </header>) -->
<div id="mobileMenu"
    class="fixed inset-0 z-[100] bg-surface-container-lowest/98 backdrop-blur-lg flex-col items-center justify-start hidden opacity-0 transition-opacity duration-300">
    <div class="flex justify-between items-center w-full px-margin-mobile h-16 border-b border-outline-variant/30">
        <span class="font-headline-sm font-bold text-primary">Menu</span>
        <button onclick="toggleMenu()"
            class="text-on-surface bg-surface-container p-2 rounded-full active:bg-surface-container-high transition-colors">
            <span class="material-symbols-outlined">close</span>
        </button>
    </div>

    <nav id="mobileNav" class="flex flex-col gap-6 w-full px-margin-mobile mt-8">
        <a href="./index.html"
            class="flex items-center gap-4 text-headline-sm font-bold text-on-surface hover:text-primary transition-colors border-b border-outline-variant/20 pb-4">
            <span class="material-symbols-outlined text-primary">home</span> Trang chủ
        </a>
        <a href="./about.html"
            class="flex items-center gap-4 text-headline-sm font-bold text-on-surface hover:text-primary transition-colors border-b border-outline-variant/20 pb-4">
            <span class="material-symbols-outlined text-primary">info</span> Về chúng tôi
        </a>
        <a href="./programs.html"
            class="flex items-center gap-4 text-headline-sm font-bold text-on-surface hover:text-primary transition-colors border-b border-outline-variant/20 pb-4">
            <span class="material-symbols-outlined text-primary">design_services</span> Chương trình
        </a>
        <a href="./testimonials.html"
            class="flex items-center gap-4 text-headline-sm font-bold text-on-surface hover:text-primary transition-colors border-b border-outline-variant/20 pb-4">
            <span class="material-symbols-outlined text-primary">reviews</span> Khách hàng
        </a>
        <a href="./contact.html"
            class="flex items-center gap-4 text-headline-sm font-bold text-on-surface hover:text-primary transition-colors border-b border-outline-variant/20 pb-4">
            <span class="material-symbols-outlined text-primary">contact_support</span> Liên hệ
        </a>
    </nav>
</div>
<script>
    function toggleMenu() {
        const menu = document.getElementById('mobileMenu');
        const isHidden = menu.classList.contains('hidden');

        if (isHidden) {
            // Hiển thị menu
            menu.classList.remove('hidden');
            menu.classList.add('flex');
            // Cần một độ trễ siêu nhỏ để CSS transition hoạt động
            setTimeout(() => {
                menu.classList.remove('opacity-0');
                menu.classList.add('opacity-100');
            }, 10);
            document.body.style.overflow = 'hidden'; // Khóa cuộn trang nền
        } else {
            // Đóng menu
            menu.classList.remove('opacity-100');
            menu.classList.add('opacity-0');
            setTimeout(() => {
                menu.classList.add('hidden');
                menu.classList.remove('flex');
                document.body.style.overflow = ''; // Mở lại cuộn trang
            }, 300); // 300ms khớp với duration-300 của Tailwind
        }
    }

    // Dynamic Navigation Highlight
    document.addEventListener('DOMContentLoaded', () => {
        let path = window.location.pathname;
        let page = path.split('/').pop();
        if (page === '' || page === '/') page = 'index.html';

        // Desktop Nav Highlight
        const desktopLinks = document.querySelectorAll('#desktopNav a');
        desktopLinks.forEach(link => {
            const href = link.getAttribute('href').replace('./', '');
            if (href === 'programs.html') {
                if (page === 'programs.html') {
                    link.classList.remove('bg-primary/10', 'text-primary');
                    link.classList.add('bg-primary', 'text-white');
                    const innerDot = link.querySelector('span.relative.inline-flex.rounded-full.h-2.w-2');
                    if (innerDot) {
                        innerDot.classList.remove('bg-secondary');
                        innerDot.classList.add('bg-white');
                    }
                }
                return; // Xử lý xong thì bỏ qua
            }
            
            if (href === page || (page === 'index.html' && href === '')) {
                link.classList.remove('text-on-surface-variant', 'after:w-0');
                link.classList.add('text-primary', 'after:w-full');
            }
        });

        // Mobile Nav Highlight
        const mobileLinks = document.querySelectorAll('#mobileNav a');
        if (mobileLinks.length > 0) {
            mobileLinks.forEach(link => {
                const href = link.getAttribute('href').replace('./', '');
                
                if (href === page || (page === 'index.html' && href === '')) {
                    link.classList.remove('text-on-surface', 'border-outline-variant/20');
                    if (href === 'programs.html') {
                        link.classList.add('bg-primary', 'text-white', 'rounded-2xl', 'p-4', 'shadow-md', 'border-none');
                        const icon = link.querySelector('.material-symbols-outlined');
                        if (icon) {
                            icon.classList.remove('text-primary');
                            icon.classList.add('text-white');
                        }
                    } else {
                        link.classList.add('text-primary', 'border-primary');
                    }
                }
            });
        }
    });
</script>
